spring:
  application:
    name: modivra

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      base-url: ${XAI_BASE_URL:https://api.x.ai/v1}
      api-key: ${XAI_API_KEY:dummy-key}
      chat:
        options:
          model: ${XAI_MODEL:grok-2-latest}
          temperature: 0.7

server:
  port: 8080
